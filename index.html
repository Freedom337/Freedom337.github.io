<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Green Terminal — App Preview</title>
<style>
  :root {
    --bg: #0b0e0b; --surface: #131711; --surface2: #1b2019;
    --gold: #c9a35c; --green: #4cc38a;
    --text: #eae5d3; --muted: #8f8b7e; --line: #242a20;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    background: #050705;
    display: flex; justify-content: center; min-height: 100vh;
    font-family: Georgia, 'Times New Roman', serif;
  }
  #phone {
    width: 100%; max-width: 420px; height: 100vh;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column;
    position: relative; overflow: hidden;
  }
  @media (min-width: 480px) {
    body { padding: 24px 0; }
    #phone {
      height: 860px; max-height: 92vh; border-radius: 36px;
      border: 10px solid #1a1d1a; box-shadow: 0 30px 80px rgba(0,0,0,.7);
    }
  }
  .statusbar {
    display: flex; justify-content: space-between; padding: 10px 20px 2px;
    font: 12px/1 -apple-system, system-ui, sans-serif; color: var(--muted);
  }
  .masthead { padding: 14px 18px 12px; border-bottom: 1px solid var(--line); }
  .brand { font: 600 11px/1 'Courier New', monospace; letter-spacing: 2.5px; color: var(--gold); }
  .masthead h1 { font-size: 26px; font-weight: 500; margin-top: 4px; }
  .masthead .sub { font-size: 13px; color: var(--muted); margin-top: 3px; font-style: italic; }
  #content { flex: 1; overflow-y: auto; padding: 12px 14px 16px; }
  #content::-webkit-scrollbar { width: 0; }
  .section { font: 600 10.5px/1 'Courier New', monospace; letter-spacing: 1.8px; color: var(--muted); margin: 14px 4px 8px; }
  .section:first-child { margin-top: 2px; }
  .card {
    background: var(--surface); border-radius: 14px; padding: 14px;
    margin-bottom: 10px; cursor: pointer; transition: transform .12s;
  }
  .card:active { transform: scale(.985); }
  .card .meta { display: flex; justify-content: space-between; align-items: baseline; }
  .tag { font: 600 10.5px/1 'Courier New', monospace; letter-spacing: 1.6px; color: var(--gold); }
  .tag.green { color: var(--green); }
  .time { font-size: 12px; color: var(--muted); font-style: italic; }
  .card h2 { font-size: 16.5px; font-weight: 500; margin: 8px 0 5px; }
  .card p { font-size: 14px; line-height: 1.45; color: var(--text); opacity: .92; }
  .card .body { display: none; margin-top: 8px; font-size: 13px; color: var(--muted); line-height: 1.5; }
  .card.open .body { display: block; }
  .card .body a { color: var(--gold); }
  .instr { font-size: 12px; color: var(--muted); text-align: center; padding: 2px 0 10px; font-style: italic; }
  .readstat { display: inline-block; margin-top: 8px; font: 10px 'Courier New', monospace; letter-spacing: 1.2px; color: var(--green); }
  /* Pricing */
  .tierswitch { display: flex; justify-content: center; gap: 8px; margin: 4px 0 12px; }
  .tierswitch button {
    background: var(--surface2); border: 1px solid var(--line); color: var(--muted);
    font: 12px -apple-system, system-ui, sans-serif; border-radius: 16px;
    padding: 6px 14px; cursor: pointer;
  }
  .tierswitch button.active { color: var(--gold); border-color: var(--gold); }
  .tier { position: relative; border: 1px solid var(--line); }
  .tier.featured { border-color: var(--gold); }
  .tier .badge {
    position: absolute; top: -9px; right: 12px; background: var(--gold); color: var(--bg);
    font: 600 10px -apple-system, system-ui, sans-serif; letter-spacing: 1px;
    padding: 3px 8px; border-radius: 8px;
  }
  .tier h2 { color: var(--gold); }
  .tier .price { font-size: 22px; margin: 6px 0 2px; }
  .tier .price small { font-size: 12px; color: var(--muted); }
  .tier ul { margin: 8px 0 10px 16px; }
  .tier li { font-size: 12.5px; color: var(--muted); margin-bottom: 4px; line-height: 1.4; }
  .tier .subbtn {
    display: block; text-align: center; text-decoration: none; border-radius: 10px;
    padding: 10px; font: 600 13px -apple-system, system-ui, sans-serif;
    background: var(--gold); color: var(--bg); margin-bottom: 6px;
  }
  .tier .subbtn.ghost { background: none; border: 1px solid var(--line); color: var(--muted); }
  .portal { text-align: center; font-size: 12.5px; margin: 4px 0 10px; }
  .portal a { color: var(--gold); }
  /* Saturday signup */
  .signup { border: 1px dashed var(--gold); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .signup h2 { font-size: 15.5px; color: var(--gold); margin-bottom: 4px; }
  .signup p { font-size: 13px; color: var(--muted); line-height: 1.45; margin-bottom: 10px; }
  .signup form { display: flex; gap: 8px; }
  .signup input {
    flex: 1; background: var(--surface2); border: 1px solid var(--line);
    border-radius: 18px; padding: 9px 14px; color: var(--text);
    font: 14px Georgia, serif; outline: none; min-width: 0;
  }
  .signup button {
    background: var(--green); color: #08130b; border: none; border-radius: 18px;
    padding: 9px 16px; font: 600 13px -apple-system, system-ui, sans-serif; cursor: pointer;
  }
  .signup .ok { color: var(--green); font-size: 13px; font-style: italic; }
  /* Chat */
  #chatlog { display: flex; flex-direction: column; gap: 8px; padding-bottom: 8px; }
  .bubble { max-width: 78%; padding: 10px 13px; border-radius: 16px; font-size: 14.5px; line-height: 1.4; }
  .bubble .t { display: block; font: 10px 'Courier New', monospace; letter-spacing: 1px; margin-top: 4px; opacity: .65; }
  .bubble.them { background: var(--surface); border-bottom-left-radius: 5px; align-self: flex-start; }
  .bubble.them .t { color: var(--gold); }
  .bubble.me { background: var(--green); color: #08130b; border-bottom-right-radius: 5px; align-self: flex-end; }
  .typing { color: var(--muted); font-size: 13px; font-style: italic; }
  #inputbar { display: none; gap: 8px; padding: 10px 12px 14px; border-top: 1px solid var(--line); background: var(--bg); }
  #inputbar.show { display: flex; }
  #msg {
    flex: 1; background: var(--surface2); border: 1px solid var(--line);
    border-radius: 22px; padding: 11px 16px; color: var(--text);
    font: 15px Georgia, serif; outline: none;
  }
  #msg:focus { border-color: var(--gold); }
  #send { width: 44px; height: 44px; border-radius: 50%; border: none; background: var(--gold); color: var(--bg); font-size: 18px; cursor: pointer; }
  /* Bottom nav */
  #nav { display: flex; border-top: 1px solid var(--line); background: var(--bg); padding: 6px 0 14px; }
  .navitem {
    flex: 1; background: none; border: none; color: var(--muted);
    font: 12.5px -apple-system, system-ui, sans-serif; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  .navitem svg { width: 22px; height: 22px; fill: currentColor; }
  .navitem.active { color: var(--gold); }
</style>
</head>
<body>
<div id="phone">
  <div class="statusbar"><span>Green Terminal</span><span id="clock"></span></div>

  <div class="masthead">
    <div class="brand">GREEN TERMINAL</div>
    <h1 id="title">News</h1>
    <div class="sub" id="subtitle"></div>
  </div>

  <div id="content"></div>

  <div id="inputbar">
    <input id="msg" placeholder="Message the desk…" autocomplete="off" />
    <button id="send" aria-label="Send">➤</button>
  </div>

  <div id="nav">
    <button class="navitem active" data-tab="news">
      <svg viewBox="0 0 24 24"><path d="M4 4h13a2 2 0 0 1 2 2v12h1a1 1 0 0 1 0 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm2 4v10h11V8H6zm2 2h7v2H8v-2zm0 4h7v2H8v-2z"/></svg>
      News</button>
    <button class="navitem" data-tab="research">
      <svg viewBox="0 0 24 24"><path d="M5 3h11l4 4v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zm10 1v4h4M8 12h8v2H8v-2zm0 4h8v2H8v-2z"/></svg>
      Research</button>
    <button class="navitem" data-tab="chat">
      <svg viewBox="0 0 24 24"><path d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-5 4V6a2 2 0 0 1 2-2h16zM6 8v2h12V8H6zm0 4v2h8v-2H6z"/></svg>
      Chat</button>
  </div>
</div>

<script>
/* ===== Content mirrored from green-terminal.com ===== */

const FEED = [
  { cat:'PRE-MARKET BRIEF', time:'Every trading day · 08:30 ET', read:'READ < 4 MIN',
    title:'Overnight moves, the day\u2019s calendar, the options pulse',
    sum:'Overnight moves and what drove them, the day\u2019s earnings and event calendar, the options pulse, and the single observation that matters \u2014 in your inbox before the open. 36 names, breadth, catalysts.',
    body:'The daily Pre-Market Brief lands every trading day at 08:30 ET: overnight price action across the 36-name coverage universe, MSOS breadth and volume, the day\u2019s catalysts, and one observation that matters. Read time under four minutes.' },
  { cat:'FLASH NOTE \u2116 001', time:'6 Oct 2026', read:'PUBLIC EXTRACT',
    title:'Curaleaf\u2019s revised bid for Aurora',
    sum:'When a qualifying event hits \u2014 M&A or financing by a covered operator, a federal action that moves the rescheduling clock, an earnings beat or miss of 10% or more \u2014 a note the same morning.',
    body:'Flash Notes go to Pro subscribers the same morning a qualifying event hits. Note \u2116 001 covered Curaleaf\u2019s revised bid for Aurora.<br><br><a href="https://green-terminal.com/samples/flash-001.html" target="_blank" rel="noopener">Read the public extract \u2197</a>' },
  { cat:'FRIDAY CLOSE', time:'Weekly · Friday after the close', read:'FREE DIGEST + FULL EDITION',
    title:'The week compressed into positioning-relevant synthesis',
    sum:'Price action, the 36-name heatmap, the MSOS dashboard, short positioning, Scorecard ranks and the Credit Stress Index reading. The full edition adds options positioning, attribution and index components.',
    body:'The Friday Close Standard edition covers price action, the 36-name heatmap, MSOS dashboard, short positioning, Scorecard ranks and the Credit Stress Index reading. The full edition (Plus) adds MSOS options positioning \u2014 the call wall, vol regime \u2014 attribution, all five Scorecard pillars and index components. A free digest goes to every Saturday-morning wrap subscriber.' },
  { cat:'EARNINGS PREVIEW', time:'Each earnings season', read:'ONE PAGE PER OPERATOR',
    title:'The three numbers that move the pillars',
    sum:'One page per Scorecard operator before it reports: the three numbers that move its pillars and the options set-up into the print.',
    body:'Ahead of every Scorecard operator\u2019s print: one page with the three numbers that move its Scorecard pillars, and the options set-up into the report. Included with Plus and Pro.' },
];

const INSTRUMENTS = [
  { name:'MSO Scorecard', cad:'WEEKLY · RANKS EVERY FRIDAY', tag:'16 operators, five pillars.',
    desc:'Weekly ranking of every major MSO across five pillars \u2014 cash generation, debt coverage, state exposure, execution, and valuation.' },
  { name:'Cannabis Credit Stress Index', cad:'WEEKLY · HEADLINE EVERY FRIDAY', tag:'Composite refinancing-risk indicator.',
    desc:'Tracks maturity walls, covenant headroom, spreads, and lender concentration. Scaled 0\u2013100.' },
  { name:'State Market Share Heatmap', cad:'MONTHLY', tag:'Operator share by state.',
    desc:'Operator-level share shifts across legal states, normalized from regulatory and dispensary-level data.' },
  { name:'Catalyst Probability Matrix', cad:'MONTHLY', tag:'The desk\u2019s estimate, on the record.',
    desc:'Probability-weighted framework for Schedule III, SAFE Banking, 280E reform, and state-level legalizations \u2014 revised on the record, with full history.' },
  { name:'Positioning', cad:'WEEKLY · EVERY FRIDAY', tag:'Where the crowd is.',
    desc:'MSOS options open interest by strike (the call wall), implied against realised volatility, and short interest with days to cover for the 36 names.' },
];

const PRODUCTS = [
  { name:'Pre-Market Brief', cad:'EVERY TRADING DAY · 08:30 ET', tag:'The daily discipline.',
    desc:'Overnight moves and what drove them, the day\u2019s earnings and event calendar, the options pulse, and the single observation that matters \u2014 in your inbox before the open. Read time under four minutes.' },
  { name:'The Friday Close', cad:'WEEKLY · FRIDAY AFTER THE CLOSE', tag:'The week, distilled.',
    desc:'Price action, the 36-name heatmap, the MSOS dashboard, short positioning, Scorecard ranks and the Credit Stress Index reading. Full edition adds options positioning and the five-pillar Scorecard.' },
  { name:'Flash Notes', cad:'SAME MORNING · QUALIFYING EVENTS', tag:'Event-driven, when it happens.',
    desc:'M&A or financing by a covered operator, a federal action that changes the rescheduling clock, an earnings beat or miss of 10% or more \u2014 a note the same morning.' },
  { name:'Earnings Previews', cad:'EACH SEASON', tag:'Into the print.',
    desc:'One page per Scorecard operator before it reports: the three numbers that move its pillars and the options set-up into the print.' },
  { name:'Monthly Package', cad:'FIRST TUESDAY, MONTHLY', tag:'One sitting, once a month.',
    desc:'Deep Dive, State Market Share Heatmap, Catalyst Probability Matrix, Valuation Map, Deals & Financings tracker, and the Event Library.' },
  { name:'State Monitor', cad:'QUARTERLY', tag:'One state per quarter.',
    desc:'Framework, sales and price, operator landscape, what management says, and what it means for the Scorecard.' },
];

const TIERS = {
  monthly: [
    { name:'Standard', tagline:'The daily discipline.',
      summary:'Pre-Market Brief every trading day, the Friday Close (Standard edition) and the live Catalyst Calendar.',
      features:['Pre-Market Brief every trading day, 08:30 ET','Friday Close, Standard edition','Live Catalyst Calendar \u2014 dated, sourced, updated weekly'],
      link:'https://buy.stripe.com/dRmbJ1eWsa6c78dbCMdMI06' },
    { name:'Plus', tagline:'The full instruments.', featured:true,
      summary:'Everything in Standard, plus the full Friday Close, the monthly package and earnings previews.',
      features:['Everything in Standard','Friday Close, full edition \u2014 options positioning, attribution, five-pillar Scorecard','Monthly package, first Tuesday','Earnings previews every season','Back-issue archive'],
      link:'https://buy.stripe.com/eVqeVd3dK6U0505fT2dMI08' },
    { name:'Pro', tagline:'The desk.',
      summary:'Everything in Plus, with same-morning Flash Notes, the quarterly State Teardown, data packs and up to three seats.',
      features:['Everything in Plus','Flash Notes the same morning on qualifying events','Quarterly State Teardown','Daily and weekly data packs (CSV/JSON)','Data room with running history','Up to three seats'],
      link:'https://buy.stripe.com/cNi6oH29G6U09glayIdMI03' },
  ],
  yearly: [
    { name:'Standard', tagline:'The daily discipline.',
      summary:'Pre-Market Brief every trading day, the Friday Close (Standard edition) and the live Catalyst Calendar.',
      features:['Pre-Market Brief every trading day, 08:30 ET','Friday Close, Standard edition','Live Catalyst Calendar','14-day money-back on annual'],
      link:'https://buy.stripe.com/14A00jcOk6U00JP36gdMI07' },
    { name:'Plus', tagline:'The full instruments.', featured:true,
      summary:'Everything in Standard, plus the full Friday Close, the monthly package and earnings previews.',
      features:['Everything in Standard','Friday Close, full edition','Monthly package, first Tuesday','Earnings previews every season','Back-issue archive','14-day money-back on annual'],
      link:'https://buy.stripe.com/fZu5kDdSobageAF6isdMI09' },
    { name:'Pro', tagline:'The desk.',
      summary:'Everything in Plus, with Flash Notes, State Teardown, data packs and up to three seats.',
      features:['Everything in Plus','Flash Notes same-morning','Quarterly State Teardown','Daily + weekly data packs','Data room','Up to three seats','14-day money-back on annual'],
      link:'https://buy.stripe.com/bJe00j3dKdio9gl4akdMI0a' },
  ],
};

const STRIPE_PORTAL = 'https://billing.stripe.com/p/login/7sYdR98y4928akpfT2dMI00';
const SIGNUP_HOOK = 'https://hook.us2.make.com/s6wa4pxl84mhspjctdjtizy1ba701ehy';

const REPLIES = [
  'Thanks for your message. The research desk will respond here \u2014 this demo reply is placeholder until chat is connected to the Green Terminal backend.',
  'Noted. In production this thread connects to your Green Terminal subscription chat.',
  'Got it \u2014 the desk typically answers within market hours.',
];

/* ===== App logic ===== */

const content = document.getElementById('content');
const title = document.getElementById('title');
const subtitle = document.getElementById('subtitle');
const inputbar = document.getElementById('inputbar');
const nav = document.querySelectorAll('.navitem');
let billing = 'monthly';
document.getElementById('clock').textContent =
  new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
const today = new Date().toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric'});
let replyIdx = 0;

function show(tab) {
  nav.forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  inputbar.classList.toggle('show', tab === 'chat');
  if (tab === 'news') renderNews();
  if (tab === 'research') renderResearch();
  if (tab === 'chat') renderChat();
  content.scrollTop = 0;
}

function renderNews() {
  title.textContent = 'News'; subtitle.textContent = today;
  content.innerHTML = '<div class="instr">The desk\u2019s published feed \u00b7 tap to expand</div>' +
    FEED.map(a => `
      <div class="card" onclick="this.classList.toggle('open')">
        <div class="meta"><span class="tag">${a.cat}</span><span class="time">${a.time}</span></div>
        <h2>${a.title}</h2><p>${a.sum}</p>
        <div class="body">${a.body}<span class="readstat">${a.read}</span></div>
      </div>`).join('');
}

function tierCard(t) {
  return `
    <div class="card tier ${t.featured ? 'featured' : ''}">
      ${t.featured ? '<div class="badge">RECOMMENDED</div>' : ''}
      <h2>${t.name}</h2>
      <div class="time">${t.tagline}</div>
      <p style="margin-top:6px">${t.summary}</p>
      <ul>${t.features.map(f => `<li>${f}</li>`).join('')}</ul>
      <a class="subbtn" href="${t.link}" target="_blank" rel="noopener">Subscribe ${t.price === 'yearly' ? 'annually' : 'monthly'} \u2197</a>
    </div>`;
}

function renderResearch() {
  title.textContent = 'Research';
  subtitle.textContent = 'Independent, subscriber-funded US cannabis research.';

  content.innerHTML = `
    <div class="signup">
      <h2>The free Friday wrap</h2>
      <p>Every Saturday morning: the week in US cannabis \u2014 the KPI card and three sourced facts. Free. No daily brief, no tables \u2014 those are for subscribers.</p>
      <form id="nlform">
        <input type="email" required placeholder="you@firm.com" id="nlemail" />
        <button type="submit">Sign up</button>
      </form>
    </div>

    <div class="section">PRODUCTS</div>
    ${PRODUCTS.map(p => `
      <div class="card">
        <div class="tag">${p.name}</div>
        <div class="tag green" style="margin-top:4px">${p.cad}</div>
        <h2>${p.tag}</h2><p style="color:var(--muted);font-size:13px">${p.desc}</p>
      </div>`).join('')}

    <div class="section">FIVE PROPRIETARY INSTRUMENTS</div>
    ${INSTRUMENTS.map(p => `
      <div class="card">
        <div class="tag">${p.name}</div>
        <div class="tag green" style="margin-top:4px">${p.cad}</div>
        <h2>${p.tag}</h2><p style="color:var(--muted);font-size:13px">${p.desc}</p>
      </div>`).join('')}
    <div class="instr">Headline readings appear in every Friday Close; the full tables go to subscribers.</div>

    <div class="section">SUBSCRIBE</div>
    <div class="tierswitch">
      <button class="${billing==='monthly'?'active':''}" onclick="setBilling('monthly')">Monthly</button>
      <button class="${billing==='yearly'?'active':''}" onclick="setBilling('yearly')">Annual</button>
    </div>
    <div id="tiers">${TIERS[billing].map(tierCard).join('')}</div>
    <div class="portal">Already subscribed? <a href="${STRIPE_PORTAL}" target="_blank" rel="noopener">Manage your account \u2197</a></div>
    <a style="display:block;text-align:center;text-decoration:none;background:var(--surface2);color:var(--muted);border:1px solid var(--line);border-radius:12px;padding:13px;margin:6px 0 12px;font:600 13px -apple-system,system-ui,sans-serif" href="https://green-terminal.com/samples/flash-001.html" target="_blank" rel="noopener">See a sample \u2014 Flash Note \u2116 001 \u2197</a>`;

  document.getElementById('nlform').addEventListener('submit', e => {
    e.preventDefault();
    const email = document.getElementById('nlemail').value.trim();
    fetch(SIGNUP_HOOK, {
      method: 'POST', mode: 'no-cors',
      headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body: new URLSearchParams({email, source: 'app-preview'}),
    }).catch(() => {});
    e.target.outerHTML = '<div class="ok">\u2713 Noted \u2014 the first wrap lands Saturday morning.</div>';
  });
}

function setBilling(b) { billing = b; renderResearch(); }

function renderChat() {
  title.textContent = 'Chat';
  subtitle.textContent = 'Direct line to the research desk.';
  content.innerHTML = `<div id="chatlog">
      <div class="bubble them">Welcome to Green Terminal. Ask the desk anything about US cannabis markets.<span class="t">${stamp()}</span></div>
    </div><div class="instr" style="padding-top:4px">Demo \u2014 replies are placeholders</div>`;
}

function stamp() { return new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); }

function send() {
  const input = document.getElementById('msg');
  const text = input.value.trim();
  if (!text) return;
  const log = document.getElementById('chatlog');
  log.insertAdjacentHTML('beforeend',
    `<div class="bubble me">${escapeHtml(text)}<span class="t">${stamp()}</span></div>
     <div class="bubble them typing" id="typing">desk is typing\u2026</div>`);
  input.value = '';
  content.scrollTop = content.scrollHeight;
  setTimeout(() => {
    const t = document.getElementById('typing');
    if (t) t.outerHTML = `<div class="bubble them">${REPLIES[replyIdx++ % REPLIES.length]}<span class="t">${stamp()}</span></div>`;
    content.scrollTop = content.scrollHeight;
  }, 900);
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

nav.forEach(b => b.addEventListener('click', () => show(b.dataset.tab)));
document.getElementById('send').addEventListener('click', send);
document.getElementById('msg').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
show('news');
</script>
</body>
</html>
